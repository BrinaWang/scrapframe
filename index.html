<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scrapframe">
<meta name="theme-color" content="#f4f3ef">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Scrapframe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Anton&family=Caveat:wght@500&family=Reenie+Beanie&family=Pinyon+Script&family=Special+Elite&family=Old+Standard+TT:wght@700&family=Bebas+Neue&family=Stardos+Stencil:wght@700&family=UnifrakturMaguntia&family=Permanent+Marker&family=Sedgwick+Ave+Display&family=Rubik+Spray+Paint&family=Rubik+Wet+Paint&family=Rubik+Bubbles&family=Bungee&display=swap">
<style>
/*
VOICE: a maker's studio tool, quiet chrome so the artwork carries the colour.
IDEA: a self-healing cutting mat on a craft table; the paper sits on the mat, the reel runs along the bottom like a film strip.
PICTURE: the live canvas itself, large and centred on the green mat.
COLOUR and TYPE: graphite chrome, cutting-mat green, one ultramarine-pigment accent; Instrument Sans throughout.
LAYOUT: tool rail left, canvas centre with floating size/opacity sliders, tabbed studio drawer right, frame strip below.
*/
:root{--chrome:#ffffff;--chrome2:#f2f2f0;--line:#e1e1dd;--ink:#18191b;--muted:#64666b;--accent:#3452ff;--accentSoft:#e7eaff;--mat:#2c5a4b;--mat2:#24493d;--danger:#d93a22;--shadow:0 8px 28px rgba(0,0,0,.18);color-scheme:light}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{height:100vh;height:100dvh;display:grid;grid-template-columns:64px minmax(0,1fr) 316px;grid-template-rows:56px minmax(0,1fr) auto;grid-template-areas:"top top top" "rail mat panel" "time time time";background:var(--chrome);color:var(--ink);font:15px/1.4 "Instrument Sans",system-ui,-apple-system,"Helvetica Neue",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body.panel-closed{grid-template-columns:64px minmax(0,1fr) 0}
body.panel-closed #panel{display:none}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none;border:0;background:none;touch-action:manipulation}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;pointer-events:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.ib:hover{background:var(--chrome2)}
.ib:disabled{opacity:.35;cursor:default}
.tb{height:40px;padding:0 14px;border-radius:10px;display:inline-flex;align-items:center;gap:8px;background:var(--chrome2);font-weight:600;white-space:nowrap}
.tb.primary{background:var(--accent);color:#fff}
.tb.on{background:var(--accentSoft);color:var(--accent)}
:root[data-theme=dark] .tb.on{color:#aab8ff}
#top{grid-area:top;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;padding-right:8px;white-space:nowrap}
.brand b{display:block;width:26px;height:26px;border-radius:7px;background:conic-gradient(from 200deg,#3452ff,#2c5a4b,#f2c21b,#e2401c,#3452ff);transform:rotate(-6deg)}
.sep{width:1px;height:28px;background:var(--line);margin:0 4px;flex:none}
.grow{flex:1}
.transport{display:flex;align-items:center;gap:2px;background:var(--chrome2);border-radius:12px;padding:2px}
.transport .ib{width:40px;height:40px}
#btnPlay{background:var(--accent);color:#fff}
#btnPlay svg{fill:currentColor}
select.sel{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--chrome);padding:0 8px;font-size:15px}
.menuwrap{position:relative}
.menu{position:fixed;z-index:60;min-width:260px;background:var(--chrome);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px}
.menu button{display:flex;width:100%;text-align:left;padding:11px 12px;border-radius:9px;gap:10px;align-items:center}
.menu button:hover{background:var(--chrome2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px}
#rail{grid-area:rail;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-right:1px solid var(--line);overflow-y:auto;scrollbar-width:none}
#rail::-webkit-scrollbar{display:none}
#rail .ib{width:42px;height:42px;flex:none}
#rail .ib.on{background:var(--accent);color:#fff}
#rail .gap{height:6px;flex:none}
#well{width:40px;height:40px;border-radius:50%;border:3px solid var(--chrome);box-shadow:0 0 0 1.5px var(--line);margin-top:auto;flex:none}
#mat{grid-area:mat;position:relative;overflow:hidden;background-color:var(--mat);background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.13) 1px,transparent 1px);background-size:24px 24px,24px 24px,120px 120px,120px 120px;touch-action:none}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:0 2px 3px rgba(0,0,0,.25),0 18px 40px rgba(0,0,0,.35);background:#fff;isolation:isolate;will-change:transform}
#stage.transparent{background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/32px 32px}
#stage>canvas,#stage>.lay,#stage>svg,#stage>#grainOv{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#stage>.lgrp{isolation:isolate}
.lgrp>canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#stage .lay img{position:absolute;left:0;top:0;transform-origin:50% 50%;pointer-events:none;-webkit-user-drag:none}
#stage .lay img.sh{filter:drop-shadow(0 1px 1px rgba(0,0,0,.22)) drop-shadow(0 4px 7px rgba(0,0,0,.16))}
#stage .lay img.sh1{filter:drop-shadow(0 1px 1.2px rgba(40,30,10,.2))}
.seg[style*=wrap] button{flex:1 0 auto;padding:0 10px}
#ctxbar .opl{flex:none;display:flex;align-items:center;gap:8px;padding:0 8px;font-weight:500;white-space:nowrap}
#ctxbar .opl input{width:110px;height:30px}
#ctxbar select{flex:none;height:40px;border-radius:9px;border:1px solid var(--line);background:var(--chrome);padding:0 8px;font-size:15px}
#grainOv{position:absolute;inset:0;mix-blend-mode:soft-light;background-repeat:repeat;transform-origin:50% 50%}
#player{display:none;background:#fff}
#ov{overflow:visible}
#sliders{position:absolute;left:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:14px;padding:12px 8px;border-radius:22px;background:var(--chrome);box-shadow:var(--shadow);z-index:5}
.vs{position:relative;width:30px;height:150px;border-radius:15px;background:var(--chrome2);touch-action:none;cursor:ns-resize}
.vs .fill{position:absolute;left:0;right:0;bottom:0;border-radius:15px;background:var(--accentSoft)}
.vs .knob{position:absolute;left:3px;width:24px;height:24px;margin-bottom:-12px;border-radius:50%;background:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.vs .lbl{position:absolute;left:0;right:0;top:6px;text-align:center;font-size:13px;font-weight:600;color:var(--muted);pointer-events:none}
.vs .bub{position:absolute;left:40px;padding:4px 9px;border-radius:8px;background:var(--ink);color:var(--chrome);font-size:13px;font-weight:600;white-space:nowrap;display:none;margin-bottom:-14px}
.vs.drag .bub{display:block}
#ctxbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:none;gap:4px;padding:5px;border-radius:14px;background:var(--chrome);box-shadow:var(--shadow);z-index:6;max-width:calc(100% - 100px);overflow-x:auto;scrollbar-width:none}
#ctxbar.show{display:flex}
#ctxbar button{flex:none;height:40px;padding:0 11px;border-radius:9px;white-space:nowrap;display:flex;align-items:center;gap:6px;font-weight:500}
#ctxbar button:hover{background:var(--chrome2)}
#ctxbar button.on{background:var(--accentSoft);color:var(--accent)}
#ctxbar .danger{color:var(--danger)}
#hud{position:absolute;right:12px;bottom:12px;display:flex;gap:6px;z-index:5}
#hud button{padding:6px 10px;border-radius:9px;background:rgba(0,0,0,.45);color:#fff;font-size:13px;font-weight:600;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hud span{padding:6px 10px;border-radius:9px;background:rgba(0,0,0,.45);color:#fff;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
#toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--chrome);padding:10px 16px;border-radius:12px;font-weight:500;box-shadow:var(--shadow);z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 40px);text-align:center}
#toast.show{opacity:1}
#welcome{position:absolute;inset:0;display:grid;place-items:center;z-index:8;pointer-events:none}
#welcome .card{pointer-events:auto;width:min(440px,calc(100% - 40px));background:var(--chrome);border-radius:20px;box-shadow:var(--shadow);padding:26px}
#welcome h1{font-size:32px;line-height:1.05;margin:0 0 10px;text-wrap:balance}
#welcome p{margin:0 0 18px;color:var(--muted)}
#welcome .row{display:flex;gap:10px;flex-wrap:wrap}
#welcome .tb{height:46px}
#panel{grid-area:panel;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--chrome)}
#tabs{display:flex;padding:6px;gap:2px;border-bottom:1px solid var(--line);flex:none}
#tabs button{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted)}
#tabs button.on{background:var(--chrome2);color:var(--ink)}
.pane{display:none;padding:14px 14px 40px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.pane.on{display:block}
.pane h3{font-size:15px;margin:22px 0 10px;display:flex;align-items:center;gap:8px;min-height:40px}
.pane h3>.tb,.pane h3>.sw{margin-left:auto}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none;margin:0 -14px;padding-left:14px;padding-right:14px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:36px;padding:0 14px;border-radius:18px;background:var(--chrome2);font-weight:600;font-size:14px}
.chips button.on{background:var(--ink);color:var(--chrome)}
.lylist{display:flex;flex-direction:column;gap:6px}
.ly{display:flex;align-items:center;gap:10px;padding:6px;border-radius:12px;background:var(--chrome2);border:2px solid transparent;cursor:pointer}
.ly.on{border-color:var(--accent)}
.ly canvas{width:64px;height:48px;border-radius:6px;background:repeating-conic-gradient(#e4e4e4 0 25%,#fff 0 50%) 0 0/12px 12px;flex:none}
.ly .nm{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ly.hid canvas,.ly.hid .nm{opacity:.4}
.ib.sm{width:40px;height:40px}
.ib.locked{color:var(--accent)}
.tb:disabled{opacity:.4;cursor:default}
.pane h3:first-child{margin-top:2px}
.note{color:var(--muted);font-size:13px;margin:6px 0 10px}
.bgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.bcard{display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:6px 6px 8px;border-radius:12px;background:var(--chrome2);text-align:left;border:2px solid transparent;position:relative}
.bcard.on{border-color:var(--accent)}
.bcard canvas{width:100%;height:44px;display:block;border-radius:6px;background:#fbfaf7}
.bcard span{font-size:13px;font-weight:600;padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcard em{font-style:normal;color:var(--accent)}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:4px 10px;align-items:center;margin:10px 0}
.srow label{font-size:14px;font-weight:500;grid-column:1/-1;display:flex;justify-content:space-between}
.srow label output{color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;grid-column:1/-1;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--accent);margin-top:-9px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:var(--accent)}
.fld{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0;font-size:14px;font-weight:500}
.fld select,.fld input[type=text],.fld input[type=number]{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--chrome);padding:0 10px;font-size:16px;max-width:60%}
.sw{position:relative;width:52px;height:32px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:16px;background:var(--line);transition:background .15s;pointer-events:none}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span::after{transform:translateX(20px)}
.seg{display:flex;background:var(--chrome2);border-radius:11px;padding:3px;gap:2px;margin:8px 0}
.seg button{flex:1;height:36px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--chrome);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.swatches{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}
.swatches button{aspect-ratio:1;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.swatches button.on{box-shadow:0 0 0 2px var(--chrome),0 0 0 4px var(--accent)}
.bigcolor{display:flex;gap:12px;align-items:center}
.bigcolor input[type=color]{width:84px;height:84px;border:0;border-radius:16px;padding:0;background:none;cursor:pointer;flex:none}
.bigcolor input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.bigcolor input[type=color]::-webkit-color-swatch{border:0;border-radius:16px}
.bigcolor input[type=text]{height:44px;width:100%;border-radius:10px;border:1px solid var(--line);background:var(--chrome);padding:0 12px;font-size:16px;font-variant-numeric:tabular-nums;text-transform:uppercase}
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tgrid button{display:flex;flex-direction:column;gap:4px;align-items:stretch;padding:4px;border-radius:12px;border:2px solid transparent;background:var(--chrome2);font-size:13px;font-weight:600}
.tgrid button.on{border-color:var(--accent)}
.tgrid canvas,.tgrid img{width:100%;aspect-ratio:4/3;object-fit:contain;border-radius:8px;display:block}
.tgrid.sq canvas,.tgrid.sq img{aspect-ratio:1}
.tgrid span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px 2px}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:40px;height:40px;border-radius:10px;background:var(--chrome2);font-size:20px;font-weight:600}
.stepper output{width:28px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0}
.actions .tb{justify-content:center}
details.adv{margin-top:14px;border-top:1px solid var(--line);padding-top:6px}
details.adv summary{cursor:pointer;font-weight:600;padding:10px 0;list-style:none;display:flex;justify-content:space-between}
details.adv summary::after{content:"+";color:var(--muted);font-size:20px;line-height:1}
details.adv[open] summary::after{content:"–"}
#timeline{grid-area:time;border-top:1px solid var(--line);display:flex;flex-direction:column;background:var(--chrome)}
#tbar{display:flex;align-items:center;gap:4px;padding:6px 10px 0;overflow-x:auto;scrollbar-width:none}
#tbar::-webkit-scrollbar{display:none}
#tbar .count{font-weight:600;font-variant-numeric:tabular-nums;padding:0 10px;white-space:nowrap}
#strip{display:flex;gap:8px;padding:8px 10px 10px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;min-height:122px}
.fr{flex:none;position:relative;padding:3px;border-radius:10px;border:2px solid transparent;background:var(--chrome2)}
.fr.on{border-color:var(--accent)}
.fr canvas{display:block;border-radius:6px;background:#fff}
.fr span{position:absolute;left:7px;bottom:7px;font-size:13px;font-weight:700;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:0 6px;font-variant-numeric:tabular-nums}
.fr.prev::after,.fr.next::after{content:"";position:absolute;top:7px;right:7px;width:10px;height:10px;border-radius:50%;background:var(--oc)}
.fr.add{width:72px;display:grid;place-items:center;color:var(--muted);border:2px dashed var(--line);background:none}
#modal{position:fixed;inset:0;background:rgba(10,12,14,.5);display:none;place-items:center;z-index:80;padding:20px}
#modal.show{display:grid}
.dlg{width:min(540px,100%);max-height:calc(100dvh - 40px);overflow:auto;background:var(--chrome);border-radius:20px;box-shadow:var(--shadow);padding:22px}
.dlg h2{margin:0 0 6px;font-size:24px;line-height:1.1}
.dlg .body{margin:10px 0 18px}
.dlg .btns{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.dlg .btns .tb{height:46px;padding:0 18px}
.dlg img.result,.dlg video.result{max-width:100%;max-height:52vh;display:block;margin:10px auto;border-radius:10px;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.choice{display:grid;gap:8px;margin:10px 0}
.choice label{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;border:2px solid var(--line);cursor:pointer}
.choice label:has(input:checked){border-color:var(--accent);background:var(--accentSoft)}
.choice input{margin-top:3px;width:20px;height:20px;accent-color:var(--accent);flex:none}
.choice b{display:block}
.choice small{color:var(--muted);font-size:13px}
.prog{height:8px;border-radius:4px;background:var(--chrome2);overflow:hidden;margin:14px 0 6px}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.peel{pointer-events:none;transform-origin:20% 50%}
@media (max-width:1050px){
  body,body.panel-closed{grid-template-columns:64px minmax(0,1fr) 0}
  #panel{position:fixed;right:0;top:56px;bottom:0;width:min(330px,90vw);z-index:40;box-shadow:var(--shadow);transform:translateX(105%);transition:transform .2s}
  body.panel-open #panel{transform:none}
  body.panel-closed #panel{display:flex}
  .hide-md{display:none}
}
@media (max-width:600px){
  body{grid-template-columns:56px minmax(0,1fr) 0}
  #rail .ib{width:42px;height:42px}
  .vs{height:110px}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== XEROX ZINE ===== off-white paper, black ink, one red, typewriter + poster lettering, hard offset shadows */
:root{--paper:#f4f3ef;--paper2:#e9e8e3;--chrome:#f4f3ef;--chrome2:#e6e4de;--line:#111;--ink:#111;--muted:#4f4f4f;--accent:#e10600;--accentSoft:#ffe1dd;--shadow:6px 6px 0 #111;--hard:3px 3px 0 #111;color-scheme:light}
body{font-family:"Special Elite","American Typewriter","Courier New",monospace;font-size:15px;background:var(--paper);background-image:linear-gradient(90deg,rgba(0,0,0,.035),transparent 5%,transparent 95%,rgba(0,0,0,.05)),radial-gradient(rgba(0,0,0,.06) .5px,transparent .9px);background-size:100% 100%,11px 11px}
.brand{gap:3px;padding-right:12px;transform:rotate(-1.5deg)}
.brand span{display:inline-block;line-height:1}
.brand .r1{font-family:Anton,Impact,sans-serif;font-size:26px;background:#111;color:var(--paper);padding:3px 7px}
.brand .r2{font-family:"Old Standard TT",Georgia,serif;font-weight:700;font-size:27px;background:#fff;padding:1px 6px;box-shadow:2px 2px 0 #111;transform:rotate(4deg)}
.brand .r3{font-family:Anton,Impact,sans-serif;font-size:26px;background:var(--accent);color:#fff;padding:3px 6px;transform:rotate(-3deg)}
.brand .r4{font-size:24px;background:#fff;padding:2px 6px;box-shadow:2px 2px 0 #111}
#top{border-bottom:2px solid #111;background:transparent}
.sep{background:#111;width:2px}
.ib{border-radius:0}
.ib:hover{background:#111;color:var(--paper)}

.pane h3{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:24px;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid #111;padding-bottom:4px}

.sw span{border-radius:0;background:#fff;border:2px solid #111}

.srow label{font-weight:400;text-transform:uppercase;font-size:13px}
.fld{font-weight:400}

.tgrid button{border-radius:0;border:2px solid #111;background:#fff;font-weight:400;text-transform:uppercase;font-size:12px}

.stepper button{border-radius:0;border:2px solid #111;background:#fff}
details.adv{border-top:2px dashed #111}

.ly{border-radius:0;border:2px solid #111;background:#fff}
.ly.on{border-color:#111;box-shadow:4px 4px 0 var(--accent)}
.ly canvas{border-radius:0;border:1px solid #111}
.ly .nm{font-weight:400}
#timeline{border-top:2px solid #111;background:var(--paper)}

#strip{background:#111;margin:8px 10px 10px;padding:12px 12px 14px;gap:12px}
.fr{border-radius:0;background:#2a2a2a;border:3px solid var(--paper);padding:0}

#modal{background:rgba(244,243,239,.6);backdrop-filter:grayscale(1)}
.dlg{border-radius:0;border:2px solid #111;box-shadow:10px 10px 0 #111;background:var(--paper)}

.choice label{border-radius:0;border:2px solid #111;background:#fff}

/* tinted tips: a small LRU that reuses its canvases, so jittered colours (gold leaf, confetti)

const tintCache = new Map();
function tinted(tipName, color) {
  const k = tipName + color;
  if (tintCache.has(k)) { const c = tintCache.get(k); tintCache.delete(k); tintCache.set(k, c); return c; }
  const t = TIPS[tipName] || TIPS.round;
  let c;
  if (tintCache.size >= 48) { const old = tintCache.keys().next().value; c = tintCache.get(old); tintCache.delete(old); }
  else c = mk(128, 128);
  const x = cx(c); x.globalCompositeOperation = 'copy'; x.drawImage(t, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = color; x.fillRect(0, 0, 128, 128); x.globalCompositeOperation = 'source-over';

/* draw a sample stroke for a brush card */
function brushPreview(canvas, b, color) {
  const W = canvas.width, H = canvas.height, ctx = cx(canvas);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
  const raw = mk(W, H), rx = cx(raw);
  const size = Math.min(b.size, H * .42) * (b.size < 6 ? 1.6 : 1);
  const st = new Stroke(rx, b, b.fixedColor || color, { mode: 'paint', size, isPen: true, streamline: 0 });
  const n = 60;
  for (let i = 0; i <= n; i++) {
    const t = i / n, x = W * .1 + t * W * .8, y = H / 2 + Math.sin(t * Math.PI * 2) * H * .2;
    st.add(x, y, Math.sin(t * Math.PI) * .85 + .15, 0);
  }
  st.finish();
  if (b.grain > 0) {
    rx.globalCompositeOperation = 'destination-in';
    rx.fillStyle = rx.createPattern(grainMask(b.grainType, b.grain, b), 'repeat'); rx.fillRect(0, 0, W, H);
  }
  const fin = finishStroke(raw, 0, 0, W, H, b, 1);
  ctx.globalAlpha = b.opacity; ctx.drawImage(fin, 0, 0); ctx.globalAlpha = 1;
}

    if (R() > .4) continue;
    const X = (R() * W) | 0; let Y = -1; for (let y = H - 1; y >= 0; y--) if (d[(y * W + X) * 4 + 3] > 140) { Y = y; break; }
    if (Y < 0) continue;
    const i = (Y * W + X) * 4, col = `rgba(${d[i]},${d[i + 1]},${d[i + 2]},${d[i + 3] / 255})`, w = Math.max(1.5, size * (.08 + R() * .12)), L = size * (.8 + R() ** 2 * 4) * amt;

let playTimer = null;

    for (const k of [...cache.keys()]) if (k !== i && (k - i + frames.length) % frames.length > 4) cache.delete(k);

        const b = Object.assign({}, BASE, { flow: .9 }, raw, { cat: 'packs', pack: pk.id, builtin: true });
        delete b.tipData; delete b.grainData;
        if (raw.tipData) { const im = await imgFromData(raw.tipData), c = mk(128, 128); cx(c).drawImage(im, 0, 0, 128, 128); TIPS[b.id] = c; b.tip = b.id; }
        if (raw.grainData) { const g = heightsFromImage(await imgFromData(raw.grainData)); b.grainH = g.h; b.grainS = g.S; b.grainType = 'custom'; }
        if (!TIPS[b.tip]) b.tip = 'round';
        b.def = Object.assign({}, b); BRUSHES.push(b);
      } catch (e) { }
    }
  }
  if ($('#p-brushes') && $('#p-brushes').classList.contains('on')) renderBrushPane(true);
  quickSig = ''; renderQuick();
}
// pack chooser row inside the "Procreate packs" category
const _rbp = renderBrushPane;
renderBrushPane = function (force) {
  _rbp.apply(this, arguments);
  const cats = $('#bCats'); if (!cats || (S.brushCat || '') !== 'packs') return;
  if (!PACKS.length) { cats.insertAdjacentHTML('afterend', '<p class="note" id="packNote">Loading brush packs…</p>'); return; }
  cats.insertAdjacentHTML('afterend', `<div class="chips packs" id="packCats">${PACKS.map(p => `<button data-pack="${p.id}" class="${(S.packCat || PACKS[0].id) === p.id ? 'on' : ''}">${esc(p.name)}</button>`).join('')}</div>`);
  $('#packCats').onclick = e => { const b = e.target.closest('[data-pack]'); if (!b) return; e.stopPropagation(); S.packCat = b.dataset.pack; renderBrushPane(true); };
};

const _initP = init;
init = async function () { await _initP(); loadBrushPacks(); };


/* ---------- boot ---------- */
init().catch(err => { console.error(err); toast('Something went wrong starting up: ' + (err && err.message), 6000); });

})();
</script>
